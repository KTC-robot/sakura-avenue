; ==============================================================================
; PlatformIO ESP32 Template
; ==============================================================================

[platformio]

; デフォルト環境
default_envs = esp32dev


; ==============================================================================
; ESP32 開発環境
; ==============================================================================

[env:esp32dev]


; ------------------------------------------------------------------------------
; ボード設定
; ------------------------------------------------------------------------------

; ESP32 Platform
platform = espressif32

; Generic ESP32 Dev Module
board = esp32dev

; Arduino Framework
framework = arduino


; ------------------------------------------------------------------------------
; ビルド設定
; ------------------------------------------------------------------------------

; Release build
build_type = release

; 標準パーティション
board_build.partitions = default.csv


; ------------------------------------------------------------------------------
; 書き込み設定
; ------------------------------------------------------------------------------

; シリアル経由で書き込み
upload_protocol = esptool

; 書き込み速度
upload_speed = 460800


; ------------------------------------------------------------------------------
; シリアルモニター設定
; ------------------------------------------------------------------------------

; 通信速度
monitor_speed = 115200

; 入力文字を表示
monitor_echo = yes

; EnterでLFを送信
monitor_eol = LF

; 受信時刻を表示
monitor_filters =
    default
    time


; ------------------------------------------------------------------------------
; ライブラリ設定
; ------------------------------------------------------------------------------

; 使用するライブラリを追加
;
; lib_deps =
;     bblanchon/ArduinoJson @ ^7.0.0


; ------------------------------------------------------------------------------
; ボード詳細設定
; ------------------------------------------------------------------------------

; 必要な場合のみ有効化
;
; board_build.f_cpu = 240000000L
; board_build.f_flash = 80000000L
; board_build.flash_mode = dio


; ------------------------------------------------------------------------------
; デバッグ設定
; ------------------------------------------------------------------------------

; JTAGデバッグを行う場合に使用
;
; debug_tool = esp-prog
; debug_init_break = tbreak setup