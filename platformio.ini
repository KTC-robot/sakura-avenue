[platformio]
src_dir = platform
default_envs = esp32c5_rx


; ============================================================
; ESP32-C5 受信側
; ============================================================
[env:esp32c5_rx]

; ------------------------------------------------------------
; Platform / Board
; モジュールはESP32-C5-WROOM-1-N16R8(推定、未確認)。N16R8用のボード定義は無く、
; PSRAMは使わないため、PSRAMなしのDevKitC-1定義をフラッシュ16MBに上書きする。
; ------------------------------------------------------------
; 公式espressif32はESP32-C5未対応のため、pioarduino版を固定する。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
framework = arduino


; ------------------------------------------------------------
; Include Paths
; ------------------------------------------------------------
build_flags =
    -I platform
    -fexceptions

build_unflags =
    -fno-exceptions


; ------------------------------------------------------------
; Serial Monitor
; ------------------------------------------------------------
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes

monitor_filters =
    time
    colorize
    esp32_exception_decoder
    send_on_enter


; ------------------------------------------------------------
; Upload
; ------------------------------------------------------------
upload_speed = 921600


; ------------------------------------------------------------
; Compiler
; 自作ソースにだけ適用する
; ------------------------------------------------------------
build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra


; ------------------------------------------------------------
; Static Analysis
; ------------------------------------------------------------
check_tool = cppcheck
check_skip_packages = yes

check_flags =
    cppcheck: --std=c++17
    cppcheck: --enable=warning,style,performance,portability
    cppcheck: --suppress=missingIncludeSystem

