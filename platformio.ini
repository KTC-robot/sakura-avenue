[platformio]
src_dir = platform
default_envs = esp32c5_rx


; ============================================================
; ESP32-C5 受信側
; ============================================================
[env:esp32c5_rx]

; ------------------------------------------------------------
; Platform / Board
; モジュールはESP32-C5-WROOM-1-N16R8(推定、未確認)。N16R8用のボード定義は無く、
; PSRAMは使わないため、PSRAMなしのDevKitC-1定義をフラッシュ16MBに上書きする。
; ------------------------------------------------------------
; 公式espressif32はESP32-C5未対応のため、pioarduino版を固定する。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
framework = arduino


; ------------------------------------------------------------
; Include Paths
; ------------------------------------------------------------
build_flags =
    -I platform
    -fexceptions

; ベンチ用ファームは別envでのみビルドする(setup/loopの重複防止)。
build_src_filter =
    +<*>
    -<bench/>

build_unflags =
    -fno-exceptions


; ------------------------------------------------------------
; Serial Monitor
; ------------------------------------------------------------
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes

monitor_filters =
    time
    colorize
    esp32_exception_decoder
    send_on_enter


; ------------------------------------------------------------
; Upload
; ------------------------------------------------------------
upload_speed = 921600


; ------------------------------------------------------------
; Compiler
; 自作ソースにだけ適用する
; ------------------------------------------------------------
build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra


; ------------------------------------------------------------
; Static Analysis
; ------------------------------------------------------------
check_tool = cppcheck
check_skip_packages = yes

check_flags =
    cppcheck: --std=c++17
    cppcheck: --enable=warning,style,performance,portability
    cppcheck: --suppress=missingIncludeSystem



; ============================================================
; C620 1台ずつ確認するモーターベンチ(車輪を浮かせて使用)
; TWAI TX=GPIO23 / RX=GPIO24。ネットワークは使わない。
; ============================================================
[env:esp32c5_motor_bench]
extends = env:esp32c5_rx
build_src_filter =
    -<*>
    +<bench/motor_bench.cpp>
    +<device/>
    +<control/speed_controller.cpp>

; ============================================================
; CAN経路の切り分け(C620なし): ESP32-C5 -> トランシーバー -> 受信ピン
; ============================================================
[env:esp32c5_can_selftest]
extends = env:esp32c5_rx
build_src_filter =
    -<*>
    +<bench/can_selftest.cpp>

; ============================================================
; 4輪オムニ同時のベンチ(車輪を浮かせて使用)。幾何は omni_bench.cpp 冒頭。
; ============================================================
[env:esp32c5_omni_bench]
extends = env:esp32c5_rx
build_src_filter =
    -<*>
    +<bench/omni_bench.cpp>
    +<device/>
    +<control/>
