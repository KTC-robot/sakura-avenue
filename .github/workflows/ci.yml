name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.12"
      - run: uv sync --locked --extra controller
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q
  host-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/host -B build/host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
  cpp-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      # ローカルのフック(.githooks/pre-commit)と整形結果を揃えるためバージョンを固定
      - run: uv tool install clang-format==23.1.5 && uv tool install clang-tidy==23.1.4
      - name: clang-format
        run: git ls-files -z '*.c' '*.h' '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
      - name: clang-tidy (ホストビルド対象のみ)
        run: |
          cmake -S tests/host -B build/host -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          jq -r '.[].file' build/host/compile_commands.json | xargs clang-tidy -p build/host --quiet
  esp32c5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build ESP32-C5 (no flash)
        run: pio run -e esp32c5_rx
