name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.12"
      - run: uv sync --locked --extra controller
        working-directory: raspberryPi
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q
        working-directory: raspberryPi
  host-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware/tests -B build/host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
  esp32c5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build ESP32-C5 (no flash)
        working-directory: firmware
        run: pio run
