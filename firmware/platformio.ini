; ESP32-C5 firmware (ESP-IDF framework via pioarduino platform)
[platformio]
default_envs = esp32c5
src_dir = main

[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = espidf
build_type = release
monitor_speed = 115200
monitor_filters = default, time
; Wi-Fi資格情報: sdkconfig.local.example を sdkconfig.local にコピーして実値を入れる
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.local
